name: Validate showcase artifacts

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Check local Markdown targets and SVG files
        run: python3 scripts/check_showcase.py
      - name: Run static checker and CI-contract regression fixtures
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
