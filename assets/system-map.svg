<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1010" viewBox="0 0 1800 1010" role="img" aria-labelledby="title desc">
  <title id="title">Legume Labs portfolio and delivery overview</title>
  <desc id="desc">Four separate public-source product projects, two public developer tools, and a reusable release path marked for repository-by-repository adoption.</desc>
  <defs>
    <filter id="shadow" x="-12%" y="-12%" width="124%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#223149" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10" fill="none" stroke="#9AA7B7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <pattern id="dotgrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#DDE4ED"/>
    </pattern>
  </defs>

  <rect width="1800" height="1010" fill="#F5F7FA"/>
  <rect width="1800" height="1010" fill="url(#dotgrid)" opacity="0.32"/>

  <text x="72" y="54" fill="#5A6A7E" font-family="Inter, Avenir Next, system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="2">LEGUME LABS  /  PORTFOLIO OVERVIEW</text>
  <text x="72" y="111" fill="#142338" font-family="Inter, Avenir Next, system-ui, sans-serif" font-size="42" font-weight="730" letter-spacing="-1.2">Different products. Shared delivery tools.</text>
  <text x="74" y="148" fill="#516174" font-family="Inter, Avenir Next, system-ui, sans-serif" font-size="18">The projects solve different jobs; the review path is reusable and configured repository by repository.</text>
  <g transform="translate(1444 44)">
    <rect width="284" height="36" rx="18" fill="#E5F1F8"/>
    <circle cx="19" cy="18" r="5" fill="#28739B"/>
    <text x="34" y="23" fill="#275E7A" font-family="Inter, Avenir Next, system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="0.6">PUBLIC SOURCES · STATUS VARIES</text>
  </g>

  <text x="72" y="197" fill="#31435A" font-family="Inter, Avenir Next, system-ui, sans-serif" font-size="13" font-weight="750" letter-spacing="1.3">01  /  PRODUCT PROJECTS</text>
  <text x="1728" y="197" text-anchor="end" fill="#7B8999" font-family="Inter, Avenir Next, system-ui, sans-serif" font-size="13">Separate repositories · separate evidence</text>

  <g filter="url(#shadow)">
    <rect x="72" y="217" width="390" height="213" rx="19" fill="#FFFFFF"/>
    <rect x="72" y="217" width="390" height="6" rx="3" fill="#28739B"/>
    <rect x="486" y="217" width="390" height="213" rx="19" fill="#FFFFFF"/>
    <rect x="486" y="217" width="390" height="6" rx="3" fill="#28739B"/>
    <rect x="900" y="217" width="390" height="213" rx="19" fill="#FFFFFF"/>
    <rect x="900" y="217" width="390" height="6" rx="3" fill="#28739B"/>
    <rect x="1314" y="217" width="414" height="213" rx="19" fill="#FFFFFF"/>
    <rect x="1314" y="217" width="414" height="6" rx="3" fill="#BA7A25"/>
  </g>
  <g font-family="Inter, Avenir Next, system-ui, sans-serif">
    <rect x="96" y="242" width="111" height="25" rx="12.5" fill="#E5F1F8"/>
    <text x="151.5" y="259" text-anchor="middle" fill="#275E7A" font-size="11" font-weight="700" letter-spacing="0.5">PUBLIC SOURCE</text>
    <text x="96" y="304" fill="#172A41" font-size="24" font-weight="720">Bean Counter</text>
    <text x="96" y="337" fill="#526276" font-size="16">Local billing CLI with SQLite records.</text>
    <line x1="96" y1="365" x2="438" y2="365" stroke="#E8EDF2"/>
    <text x="96" y="397" fill="#28739B" font-size="13" font-weight="650">Historical v0.3.0 · synthetic walkthrough</text>

    <rect x="510" y="242" width="111" height="25" rx="12.5" fill="#E5F1F8"/>
    <text x="565.5" y="259" text-anchor="middle" fill="#275E7A" font-size="11" font-weight="700" letter-spacing="0.5">PUBLIC SOURCE</text>
    <text x="510" y="304" fill="#172A41" font-size="24" font-weight="720">BeanFit</text>
    <text x="510" y="337" fill="#526276" font-size="16">Estimate model/runtime fit for a device.</text>
    <text x="510" y="360" fill="#526276" font-size="14">Uncertainty is shown; this is not a benchmark.</text>
    <line x1="510" y1="375" x2="852" y2="375" stroke="#E8EDF2"/>
    <text x="510" y="402" fill="#28739B" font-size="13" font-weight="650">CLI · inspect assumptions, then measure</text>

    <rect x="924" y="242" width="111" height="25" rx="12.5" fill="#E5F1F8"/>
    <text x="979.5" y="259" text-anchor="middle" fill="#275E7A" font-size="11" font-weight="700" letter-spacing="0.5">PUBLIC SOURCE</text>
    <text x="924" y="304" fill="#172A41" font-size="24" font-weight="720">BeanFit App</text>
    <text x="924" y="337" fill="#526276" font-size="16">Account and device companion for</text>
    <text x="924" y="360" fill="#526276" font-size="16">BeanFit recommendations.</text>
    <line x1="924" y1="375" x2="1266" y2="375" stroke="#E8EDF2"/>
    <text x="924" y="398" fill="#28739B" font-size="12.5" font-weight="650">Stores recommendation snapshots</text>
    <text x="924" y="416" fill="#768496" font-size="12">Hosted journey not qualified here</text>

    <rect x="1338" y="242" width="111" height="25" rx="12.5" fill="#E5F1F8"/>
    <text x="1393.5" y="259" text-anchor="middle" fill="#275E7A" font-size="11" font-weight="700" letter-spacing="0.5">PUBLIC SOURCE</text>
    <rect x="1581" y="242" width="123" height="25" rx="12.5" fill="#F8EEDC"/>
    <text x="1642.5" y="259" text-anchor="middle" fill="#8B5B1F" font-size="11" font-weight="700" letter-spacing="0.5">PROTOTYPE</text>
    <text x="1338" y="304" fill="#172A41" font-size="24" font-weight="720">Jumping Beans</text>
    <text x="1338" y="337" fill="#526276" font-size="16">Shopper-controlled offer journey</text>
    <text x="1338" y="360" fill="#526276" font-size="16">designed for participating storefronts.</text>
    <line x1="1338" y1="375" x2="1704" y2="375" stroke="#E8EDF2"/>
    <text x="1338" y="402" fill="#8B5B1F" font-size="13" font-weight="650">Inspect the repo for current supported scope</text>
  </g>

  <text x="72" y="475" fill="#31435A" font-family="Inter, Avenir Next, system-ui, sans-serif" font-size="13" font-weight="750" letter-spacing="1.3">02  /  SHARED DEVELOPER TOOLS</text>
  <text x="1728" y="475" text-anchor="end" fill="#7B8999" font-family="Inter, Avenir Next, system-ui, sans-serif" font-size="13">Tool capability is public · adoption varies by repository</text>
  <g filter="url(#shadow)">
    <rect x="72" y="495" width="802" height="126" rx="18" fill="#FFFFFF"/>
    <rect x="72" y="495" width="6" height="126" rx="3" fill="#318D76"/>
    <rect x="902" y="495" width="826" height="126" rx="18" fill="#FFFFFF"/>
    <rect x="902" y="495" width="6" height="126" rx="3" fill="#318D76"/>
  </g>
  <g font-family="Inter, Avenir Next, system-ui, sans-serif">
    <text x="104" y="533" fill="#172A41" font-size="22" font-weight="720">QA Kit</text>
    <text x="104" y="562" fill="#526276" font-size="15">Runs checks selected by a repository-owned manifest and records results.</text>
    <text x="104" y="596" fill="#276F5E" font-size="13" font-weight="650">Disposable pass/fail example · no account required</text>

    <text x="934" y="533" fill="#172A41" font-size="22" font-weight="720">Gate Kit</text>
    <text x="934" y="562" fill="#526276" font-size="15">Applies a documentation and check contract in configured local and CI workflows.</text>
    <text x="934" y="596" fill="#276F5E" font-size="13" font-weight="650">Synthetic demo · advisory gate, not certification</text>
  </g>

  <text x="72" y="668" fill="#31435A" font-family="Inter, Avenir Next, system-ui, sans-serif" font-size="13" font-weight="750" letter-spacing="1.3">03  /  REUSABLE RELEASE PATH  ·  WHERE CONFIGURED</text>
  <text x="1728" y="668" text-anchor="end" fill="#7B8999" font-family="Inter, Avenir Next, system-ui, sans-serif" font-size="13">Verify adoption in each repository's own manifest and workflow</text>

  <g filter="url(#shadow)">
    <rect x="72" y="690" width="300" height="143" rx="17" fill="#FFFFFF"/>
    <rect x="400" y="690" width="300" height="143" rx="17" fill="#FFFFFF"/>
    <rect x="728" y="690" width="300" height="143" rx="17" fill="#FFFFFF"/>
    <rect x="1056" y="690" width="300" height="143" rx="17" fill="#FFFFFF"/>
    <rect x="1384" y="690" width="344" height="143" rx="17" fill="#FFFFFF"/>
  </g>
  <g stroke="#A0AABA" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M374 761 H391"/><path d="M702 761 H719"/><path d="M1030 761 H1047"/><path d="M1358 761 H1375"/>
  </g>
  <g font-family="Inter, Avenir Next, system-ui, sans-serif">
    <circle cx="103" cy="719" r="12" fill="#28739B"/><text x="103" y="724" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="750">1</text>
    <text x="126" y="724" fill="#28739B" font-size="10" font-weight="750" letter-spacing="0.7">PROJECT CODE</text>
    <text x="96" y="766" fill="#172A41" font-size="20" font-weight="720">Product repo</text>
    <text x="96" y="797" fill="#5C6878" font-size="14">Code and its tests stay together.</text>

    <circle cx="431" cy="719" r="12" fill="#318D76"/><text x="431" y="724" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="750">2</text>
    <text x="454" y="724" fill="#276F5E" font-size="10" font-weight="750" letter-spacing="0.7">IF CONFIGURED</text>
    <text x="424" y="766" fill="#172A41" font-size="20" font-weight="720">QA Kit</text>
    <text x="424" y="797" fill="#5C6878" font-size="14">Runs the manifest's selected checks.</text>

    <circle cx="759" cy="719" r="12" fill="#318D76"/><text x="759" y="724" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="750">3</text>
    <text x="782" y="724" fill="#276F5E" font-size="10" font-weight="750" letter-spacing="0.7">IF CONFIGURED</text>
    <text x="752" y="766" fill="#172A41" font-size="20" font-weight="720">Gate Kit</text>
    <text x="752" y="797" fill="#5C6878" font-size="14">Applies the shared check contract.</text>

    <circle cx="1087" cy="719" r="12" fill="#BA7A25"/><text x="1087" y="724" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="750">4</text>
    <text x="1110" y="724" fill="#8B5B1F" font-size="10" font-weight="750" letter-spacing="0.7">REVIEW AND RELEASE</text>
    <text x="1080" y="766" fill="#172A41" font-size="20" font-weight="720">Versioned release</text>
    <text x="1080" y="797" fill="#5C6878" font-size="14">Tagged against a source version.</text>

    <circle cx="1415" cy="719" r="12" fill="#7653A6"/><text x="1415" y="724" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="750">5</text>
    <text x="1438" y="724" fill="#63438D" font-size="10" font-weight="750" letter-spacing="0.7">PUBLIC EVIDENCE</text>
    <text x="1408" y="766" fill="#172A41" font-size="20" font-weight="720">Inspect the record</text>
    <text x="1408" y="797" fill="#5C6878" font-size="14">Notes, demos, and assets supplied.</text>
  </g>

  <line x1="72" y1="882" x2="1728" y2="882" stroke="#DCE3EB"/>
  <text x="72" y="916" fill="#526276" font-family="Inter, Avenir Next, system-ui, sans-serif" font-size="14">A tool release proves what the tool does; each product repository is the evidence for its own adoption and results.</text>
  <text x="1728" y="916" text-anchor="end" fill="#8491A0" font-family="Inter, Avenir Next, system-ui, sans-serif" font-size="12">README PREVIEW · 4 OCT 2026</text>
</svg>
